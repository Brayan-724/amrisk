[workspace]
members = ["macros"]

[package]
name = "amrisk"
version = "0.1.0"
edition = "2024"

[features]
default = []
peg-trace = ["peg/trace"]

[dependencies]
amrisk-macros.path = "./macros"
indexmap = "2.13.0"

miette = { version = "7.6.0", features = ["fancy"] }
peg = "0.8.5"
thiserror = "2.0.16"
